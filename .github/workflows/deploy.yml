name: Deploy to GitHub Pages

# A merge into main lands as a push to main, so this covers both merges and
# direct pushes. workflow_dispatch allows a manual redeploy from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it, so main and Pages
# cannot end up out of sync.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pages is already enabled on this repo with the Actions source. The
      # enablement option is deliberately not used: GITHUB_TOKEN cannot create
      # a Pages site here ("Resource not accessible by integration").
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # sw.js is cache-first, so returning visitors keep serving the old assets
      # until the CACHE constant changes. Stamp the commit SHA into it at deploy
      # time to invalidate automatically. This edits the runner's checkout only;
      # nothing is committed back. Fails loudly if the constant is ever renamed,
      # rather than silently shipping a stale cache name.
      - name: Stamp cache version with commit SHA
        run: |
          sed -i "s/^const CACHE = .*/const CACHE = 'card-${GITHUB_SHA}';/" sw.js
          grep -q "const CACHE = 'card-${GITHUB_SHA}';" sw.js || {
            echo "::error::Failed to stamp CACHE in sw.js; check the constant name."
            exit 1
          }
          grep -n '^const CACHE' sw.js

      # The app is plain static files, so the repo root ships as-is. No build
      # step, and no .nojekyll needed: this action uploads an artifact directly
      # rather than running the content through Jekyll.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
