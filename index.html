<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HelpMe Card</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HelpMe Card">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #000;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  .scene {
    position: fixed;
    inset: 0;
    perspective: 800px;
    perspective-origin: 50% 50%;
  }

  .card {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.4, 0.0, 0.2, 1);
    /* Own the gesture outright: the browser must not claim the drag for
       panning, or pointermove stops firing part-way through a swipe. */
    touch-action: none;
  }

  .face {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    pointer-events: none;
  }

  .face.back { transform: rotateY(180deg); }

  /* preserveAspectRatio letterboxes the viewBox inside this box, matching
     object-fit: contain on the back img. front.svg paints artwork beyond its
     viewBox, which is clipped in JS so the overflow cannot reach these edges. */
  .face > svg {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="card" id="card">
      <div class="face front" id="front"></div>
      <img class="face back" src="./images/back.svg" alt="">
    </div>
  </div>

<script>
  var card = document.getElementById('card');

  // Ids of the <text> layers in front.svg. These come from the Sketch layer
  // names, so re-exporting the artboard with renamed layers will break them.
  var NAME_ID = 'Kathy-Cook';
  var EMAIL_ID = 'kcook@helpmebrands.c';

  // Card is 2126 units wide; keep replacement text inside a margin.
  var MAX_TEXT_WIDTH = 1800;

  function setField(svg, id, value) {
    if (!value) return;
    var text = svg.getElementById(id);
    if (!text) return;
    var tspan = text.querySelector('tspan') || text;

    // Capture where the designer centred the original string, then re-anchor
    // to that point so a longer or shorter value stays centred rather than
    // growing rightwards off the hardcoded x origin.
    var original = tspan.getBBox();
    var centre = original.x + original.width / 2;

    tspan.textContent = value;

    var replaced = tspan.getBBox();
    if (replaced.width > MAX_TEXT_WIDTH) {
      var size = parseFloat(text.getAttribute('font-size'));
      text.setAttribute('font-size', size * MAX_TEXT_WIDTH / replaced.width);
    }

    tspan.setAttribute('text-anchor', 'middle');
    tspan.setAttribute('x', centre);
  }

  var SVG_NS = 'http://www.w3.org/2000/svg';

  // The artboard paints past its viewBox (stray paths reach x=5451). An <img>
  // clips that automatically; an inlined <svg> does not, so it would bleed into
  // the letterbox bars. Wrap the whole tree in a clip of the viewBox instead.
  function clipToViewBox(svg) {
    var box = svg.getAttribute('viewBox').split(/[\s,]+/).map(Number);
    var rect = document.createElementNS(SVG_NS, 'rect');
    rect.setAttribute('x', box[0]);
    rect.setAttribute('y', box[1]);
    rect.setAttribute('width', box[2]);
    rect.setAttribute('height', box[3]);

    var clip = document.createElementNS(SVG_NS, 'clipPath');
    clip.setAttribute('id', 'card-clip');
    clip.appendChild(rect);

    var group = document.createElementNS(SVG_NS, 'g');
    group.setAttribute('clip-path', 'url(#card-clip)');
    while (svg.firstChild) group.appendChild(svg.firstChild);

    var defs = document.createElementNS(SVG_NS, 'defs');
    defs.appendChild(clip);
    svg.appendChild(defs);
    svg.appendChild(group);
  }

  var params = new URLSearchParams(location.search);

  fetch('./images/front.svg')
    .then(function (r) { return r.text(); })
    .then(function (markup) {
      var doc = new DOMParser().parseFromString(markup, 'image/svg+xml');
      var svg = document.importNode(doc.documentElement, true);
      // Drop the fixed px size so the CSS 100%/100% rule governs scaling.
      svg.removeAttribute('width');
      svg.removeAttribute('height');
      clipToViewBox(svg);
      // Must be in the rendered tree before getBBox() will measure text.
      document.getElementById('front').appendChild(svg);
      setField(svg, NAME_ID, params.get('name'));
      setField(svg, EMAIL_ID, params.get('email'));
    });

  // --- Flip gestures -------------------------------------------------------
  // Press position picks the axis and direction; the pressed edge is the one
  // that swings away from the viewer, so the gesture reads as pushing it back.

  var back = document.querySelector('.face.back');

  // Half-width of the centre column, as a fraction of card width. Inside it a
  // press tips the card about X; outside it, about Y.
  var CENTRE_BAND = 0.25;
  // Drag distance, as a fraction of card size, that equals a full half-turn.
  var SWIPE_FULL = 0.45;
  // Movement before a press counts as a swipe rather than a tap.
  var DRAG_MIN = 6;
  // A tap plays the whole half-turn, so it gets longer than a swipe settle,
  // which only has to finish off rotation the finger already did.
  var TAP_MS = 900;
  var SETTLE_MS = 450;

  var angle = 0;      // resting angle, normalised to exactly 0 or 180
  var axis = 'Y';     // axis the resting angle is expressed about
  var drag = null;
  var busy = false;
  var flipPending = false;
  var settleTimer = null;

  function rot(a) {
    return 'rotate' + axis + '(' + a + 'deg)';
  }

  function setTransform(a) {
    card.style.transform = rot(a);
  }

  // Degrees past the target on each successive crossing, shrinking so the card
  // wobbles into place. A cubic-bezier can only overshoot once, so the settle
  // is played as keyframes instead of a transition.
  var WOBBLE = [15, -6.5, 2.8, -1.1];
  var WOBBLE_AT = [0.58, 0.72, 0.84, 0.93];

  function animateTo(from, to, ms) {
    // Land on the resting value first: if the animation cannot run, the card is
    // already correct rather than stranded mid-turn.
    card.style.transition = 'none';
    setTransform(to);

    var delta = to - from;
    // Scale the wobble down for short travel, so a barely-moved swipe that
    // springs back does not shake harder than the distance it covered.
    var amp = (delta >= 0 ? 1 : -1) * Math.min(1, Math.abs(delta) / 90);
    var frames = [{ offset: 0, transform: rot(from),
                    easing: 'cubic-bezier(0.32, 0, 0.2, 1)' }];
    for (var i = 0; i < WOBBLE.length; i++) {
      frames.push({ offset: WOBBLE_AT[i], transform: rot(to + WOBBLE[i] * amp),
                    easing: 'ease-in-out' });
    }
    frames.push({ offset: 1, transform: rot(to) });
    return card.animate(frames, { duration: ms, fill: 'none' });
  }

  function withoutTransition(fn) {
    card.style.transition = 'none';
    fn();
    void card.offsetWidth; // flush, so the change cannot be animated
    card.style.transition = '';
  }

  // The hidden face must be pre-rotated about the SAME axis the card turns on,
  // otherwise it lands upside down: rotateX(180) on the card composed with
  // rotateY(180) on the face equals rotateZ(180). Switching both together is
  // invisible, because either pairing renders the same face upright.
  function useAxis(next) {
    if (next === axis) return;
    axis = next;
    back.style.transform = 'rotate' + axis + '(180deg)';
    withoutTransition(function () { setTransform(angle); });
  }

  function zoneAt(x, y, rect) {
    var dx = x - (rect.left + rect.width / 2);
    var dy = y - (rect.top + rect.height / 2);
    if (Math.abs(dx) <= rect.width * CENTRE_BAND) {
      return { axis: 'X', dir: dy < 0 ? 1 : -1 };  // top edge back, or bottom
    }
    return { axis: 'Y', dir: dx > 0 ? 1 : -1 };    // right edge back, or left
  }

  // A swipe reads as dragging the card's surface: swipe right and the surface
  // travels right, carrying the right edge away from the viewer; swipe up and
  // the top edge rolls away. Signed, so the card follows the finger back if the
  // swipe reverses mid-gesture.
  function swipeTurn(d) {
    var span = d.axis === 'Y' ? d.rect.width : d.rect.height;
    var moved = d.axis === 'Y' ? d.dx : -d.dy;
    return Math.max(-1, Math.min(1, moved / (span * SWIPE_FULL)));
  }

  function finalize() {
    clearTimeout(settleTimer);
    if (!busy) return;
    busy = false;
    if (!flipPending) return;
    flipPending = false;
    // Land on 0 or 180 only. The value just animated to may be -180 or 360,
    // which are the same orientations, so re-stating it is invisible and keeps
    // the angle from ever growing without bound.
    angle = angle === 0 ? 180 : 0;
    withoutTransition(function () { setTransform(angle); });
  }

  card.addEventListener('pointerdown', function (e) {
    if (busy) return; // one gesture at a time; taps during a settle are dropped
    var rect = card.getBoundingClientRect();
    // The axis is not chosen yet: a tap takes it from this position, a swipe
    // takes it from the direction the finger ends up travelling.
    drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0,
             zone: zoneAt(e.clientX, e.clientY, rect), axis: axis,
             rect: rect, moved: false, turn: 0 };
    card.style.transition = 'none';
    card.setPointerCapture(e.pointerId);
  });

  card.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    drag.dx = e.clientX - drag.x0;
    drag.dy = e.clientY - drag.y0;
    if (!drag.moved) {
      if (Math.abs(drag.dx) < DRAG_MIN && Math.abs(drag.dy) < DRAG_MIN) return;
      drag.moved = true;
      // Lock the axis to the swipe's dominant direction, once, and do it while
      // the card is still at rest so swapping the hidden face is unseen.
      drag.axis = Math.abs(drag.dx) >= Math.abs(drag.dy) ? 'Y' : 'X';
      useAxis(drag.axis);
      card.style.transition = 'none';
    }
    drag.turn = swipeTurn(drag);
    setTransform(angle + 180 * drag.turn);
  });

  function release(e) {
    if (!drag || e.pointerId !== drag.id) return;
    var d = drag;
    drag = null;
    var offset;
    if (!d.moved) {
      // A tap: press position picks axis and direction, and always completes.
      useAxis(d.zone.axis);
      flipPending = true;
      offset = d.zone.dir * 180;
    } else {
      // A swipe settles to whichever side of the halfway tipping point it was
      // let go on, carrying on the way it was already travelling.
      flipPending = Math.abs(d.turn) > 0.5;
      offset = flipPending ? (d.turn > 0 ? 180 : -180) : 0;
    }
    var ms = d.moved ? SETTLE_MS : TAP_MS;
    busy = true;
    // Arm the fallback before animating, so a thrown animate() cannot strand
    // the gesture with busy stuck true.
    clearTimeout(settleTimer);
    settleTimer = setTimeout(finalize, ms + 90);
    var anim = animateTo(angle + (d.moved ? 180 * d.turn : 0), angle + offset, ms);
    if (anim) anim.onfinish = finalize;
  }

  card.addEventListener('pointerup', release);
  card.addEventListener('pointercancel', release);

  // Block pinch-zoom and double-tap zoom.
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('touchmove', function (e) {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js');
    });
  }
</script>
</body>
</html>
