<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HelpMe Card</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HelpMe Card">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #000;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  .scene {
    position: fixed;
    inset: 0;
    perspective: 800px;
    perspective-origin: 50% 50%;
  }

  .card {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    /* Own the gesture outright: the browser must not claim the drag for
       panning, or pointermove stops firing part-way through a swipe. */
    touch-action: none;
  }

  .face {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    pointer-events: none;
  }

  .face.back { transform: rotateY(180deg); }

  /* preserveAspectRatio letterboxes the viewBox inside this box, matching
     object-fit: contain on the back img. front.svg paints artwork beyond its
     viewBox, which is clipped in JS so the overflow cannot reach these edges. */
  .face > svg {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="card" id="card">
      <div class="face front" id="front"></div>
      <img class="face back" src="./images/back.svg" alt="">
    </div>
  </div>

<script>
  var card = document.getElementById('card');

  // Ids of the <text> layers in front.svg. These come from the Sketch layer
  // names, so re-exporting the artboard with renamed layers will break them.
  var NAME_ID = 'Kathy-Cook';
  var EMAIL_ID = 'kcook@helpmebrands.c';

  // Card is 2126 units wide; keep replacement text inside a margin.
  var MAX_TEXT_WIDTH = 1800;

  function setField(svg, id, value) {
    if (!value) return;
    var text = svg.getElementById(id);
    if (!text) return;
    var tspan = text.querySelector('tspan') || text;

    // Capture where the designer centred the original string, then re-anchor
    // to that point so a longer or shorter value stays centred rather than
    // growing rightwards off the hardcoded x origin.
    var original = tspan.getBBox();
    var centre = original.x + original.width / 2;

    tspan.textContent = value;

    var replaced = tspan.getBBox();
    if (replaced.width > MAX_TEXT_WIDTH) {
      var size = parseFloat(text.getAttribute('font-size'));
      text.setAttribute('font-size', size * MAX_TEXT_WIDTH / replaced.width);
    }

    tspan.setAttribute('text-anchor', 'middle');
    tspan.setAttribute('x', centre);
  }

  var SVG_NS = 'http://www.w3.org/2000/svg';

  // The artboard paints past its viewBox (stray paths reach x=5451). An <img>
  // clips that automatically; an inlined <svg> does not, so it would bleed into
  // the letterbox bars. Wrap the whole tree in a clip of the viewBox instead.
  function clipToViewBox(svg) {
    var box = svg.getAttribute('viewBox').split(/[\s,]+/).map(Number);
    var rect = document.createElementNS(SVG_NS, 'rect');
    rect.setAttribute('x', box[0]);
    rect.setAttribute('y', box[1]);
    rect.setAttribute('width', box[2]);
    rect.setAttribute('height', box[3]);

    var clip = document.createElementNS(SVG_NS, 'clipPath');
    clip.setAttribute('id', 'card-clip');
    clip.appendChild(rect);

    var group = document.createElementNS(SVG_NS, 'g');
    group.setAttribute('clip-path', 'url(#card-clip)');
    while (svg.firstChild) group.appendChild(svg.firstChild);

    var defs = document.createElementNS(SVG_NS, 'defs');
    defs.appendChild(clip);
    svg.appendChild(defs);
    svg.appendChild(group);
  }

  var params = new URLSearchParams(location.search);

  // Launched from the home screen, the OS navigates to the manifest's
  // start_url, which carries no query string -- so the values that
  // personalised the card are gone before this runs. Remember them from the
  // visit that did have them, and fall back to those when the URL is bare.
  var FIELD_STORE = 'helpme-card-fields';

  function personalisation() {
    var live = { name: params.get('name'), email: params.get('email') };
    try {
      if (live.name || live.email) {
        localStorage.setItem(FIELD_STORE, JSON.stringify(live));
        return live;
      }
      var saved = JSON.parse(localStorage.getItem(FIELD_STORE) || '{}');
      return { name: saved.name || null, email: saved.email || null };
    } catch (err) {
      // Safari in private mode throws on storage; the URL is still authoritative.
      return live;
    }
  }

  fetch('./images/front.svg')
    .then(function (r) { return r.text(); })
    .then(function (markup) {
      var doc = new DOMParser().parseFromString(markup, 'image/svg+xml');
      var svg = document.importNode(doc.documentElement, true);
      // Drop the fixed px size so the CSS 100%/100% rule governs scaling.
      svg.removeAttribute('width');
      svg.removeAttribute('height');
      clipToViewBox(svg);
      // Must be in the rendered tree before getBBox() will measure text.
      document.getElementById('front').appendChild(svg);
      var fields = personalisation();
      setField(svg, NAME_ID, fields.name);
      setField(svg, EMAIL_ID, fields.email);
    });

  // --- Flip gestures -------------------------------------------------------
  // Press position picks the axis and direction; the pressed edge is the one
  // that swings away from the viewer, so the gesture reads as pushing it back.

  var back = document.querySelector('.face.back');

  // Half-width of the centre column, as a fraction of card width. Inside it a
  // press tips the card about X; outside it, about Y.
  var CENTRE_BAND = 0.25;
  // Drag distance, as a fraction of card size, that equals a full half-turn.
  var SWIPE_FULL = 0.45;
  // Movement before a press counts as a swipe rather than a tap.
  var DRAG_MIN = 6;
  // Angular velocity, in deg/s, past which releasing completes the turn even
  // short of halfway: a flick carries through on momentum.
  var FLICK = 220;
  // How far off a flat orientation the card may be and still change axis.
  var AXIS_SNAP = 20;

  // The card is simulated rather than animated. A frame loop integrates a
  // damped spring toward the resting angle, so the card's angle and velocity
  // are known at every instant -- which is what lets a new gesture take it
  // over mid-flight instead of waiting for the motion to finish.
  //
  //   acceleration = -w^2 * (angle - target) - 2*z*w * velocity
  //
  var OMEGA = 5.5;       // angular frequency: higher is stiffer and quicker
  var ZETA = 0.45;       // damping ratio: under 1 oscillates, 1 is a dead stop
  // Coming to rest is decided by amplitude and speed, never by a bounce count,
  // so slack damping simply oscillates more times before it stops.
  var SETTLE_EPS = 0.4;  // deg from the target that counts as arrived
  var SETTLE_VEL = 8;    // deg/s below which the card counts as stopped
  var MAX_STEP = 0.008;  // integrator sub-step; a long frame is split into these

  var angle = 0;      // current rotation, continuous while in motion
  var vel = 0;        // angular velocity, deg/s
  var target = 0;     // resting angle currently being sprung toward
  var axis = 'Y';     // axis the rotation is expressed about
  var settled = true;
  var grab = null;
  var frameReq = null;
  var lastFrame = 0;

  function rot(a) {
    return 'rotate' + axis + '(' + a + 'deg)';
  }

  function setTransform(a) {
    card.style.transform = rot(a);
  }

  // Semi-implicit Euler. Sub-stepping keeps a dropped frame from turning into a
  // huge integration step, which at stiff settings would read as a lurch.
  function integrate(dt) {
    var n = Math.max(1, Math.ceil(dt / MAX_STEP));
    var h = dt / n;
    var k = OMEGA * OMEGA;
    var c = 2 * ZETA * OMEGA;
    for (var i = 0; i < n; i++) {
      vel += (-k * (angle - target) - c * vel) * h;
      angle += vel * h;
    }
  }

  // Fold the resting angle back into 0 or 180. Every multiple of 180 is one of
  // those two orientations, so this is invisible, and it keeps the value bounded
  // no matter how many turns have been made.
  function comeToRest() {
    angle = ((target % 360) + 360) % 360;
    target = angle;
    vel = 0;
    settled = true;
  }

  function frame(now) {
    frameReq = null;
    var dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    integrate(dt);
    if (Math.abs(angle - target) < SETTLE_EPS && Math.abs(vel) < SETTLE_VEL) {
      comeToRest();
      setTransform(angle);
      return;
    }
    setTransform(angle);
    frameReq = requestAnimationFrame(frame);
  }

  function startLoop() {
    settled = false;
    if (frameReq === null) {
      lastFrame = performance.now();
      frameReq = requestAnimationFrame(frame);
    }
  }

  function stopLoop() {
    if (frameReq !== null) {
      cancelAnimationFrame(frameReq);
      frameReq = null;
    }
  }

  // The hidden face must be pre-rotated about the SAME axis the card turns on,
  // otherwise it lands upside down: rotateX(180) on the card composed with
  // rotateY(180) on the face equals rotateZ(180). Only ever called at rest,
  // where either pairing renders the same face upright, so the swap is unseen.
  function useAxis(next) {
    if (next === axis) return;
    axis = next;
    back.style.transform = 'rotate' + axis + '(180deg)';
    setTransform(angle);
  }

  // The two axes coincide at every flat orientation: rotateY(0) renders the
  // same as rotateX(0), and rotateY(180) the same as rotateX(180). So the axis
  // can be re-chosen whenever the card is near enough to flat that snapping it
  // there does not read as a jump -- not only when it has fully stopped. Part
  // turned, there is no equivalent angle about the other axis and the swap has
  // to wait. Velocity is dropped because it belonged to the old axis.
  function trySwitchAxis(next) {
    if (next === axis) return false;
    var flat = Math.round(angle / 180) * 180;
    if (Math.abs(angle - flat) > AXIS_SNAP) return false;
    angle = flat;
    vel = 0;
    useAxis(next);
    return true;
  }

  function zoneAt(x, y, rect) {
    var dx = x - (rect.left + rect.width / 2);
    var dy = y - (rect.top + rect.height / 2);
    if (Math.abs(dx) <= rect.width * CENTRE_BAND) {
      return { axis: 'X', dir: dy < 0 ? 1 : -1 };  // top edge back, or bottom
    }
    return { axis: 'Y', dir: dx > 0 ? 1 : -1 };    // right edge back, or left
  }

  // Run the same integrator off-screen, so the tuning panel reports what will
  // actually happen rather than a separate approximation of it.
  function simulate(from, to, v0) {
    var x = from, v = v0, t = 0, h = 0.004, i = 0, prevV = v0, peaks = [];
    var k = OMEGA * OMEGA, c = 2 * ZETA * OMEGA;
    while (t < 30) {
      v += (-k * (x - to) - c * v) * h;
      x += v * h;
      t += h;
      if (i > 0 && (prevV > 0) !== (v > 0) && Math.abs(x - to) > 0.3) {
        peaks.push(Math.round((x - to) * 10) / 10);
      }
      prevV = v;
      i++;
      if (Math.abs(x - to) < SETTLE_EPS && Math.abs(v) < SETTLE_VEL) break;
    }
    return { ms: t * 1000, peaks: peaks };
  }

  card.addEventListener('pointerdown', function (e) {
    var rect = card.getBoundingClientRect();
    // Take the card over wherever it happens to be. Its angle carries into the
    // drag and its velocity is left intact, so grabbing mid-flight is seamless
    // and a tap mid-flight keeps the momentum already in play.
    stopLoop();
    grab = { id: e.pointerId, x0: e.clientX, y0: e.clientY, rect: rect,
             zone: zoneAt(e.clientX, e.clientY, rect), base: angle,
             moved: false,
             vel: 0, lastT: e.timeStamp, lastDeg: 0 };
    settled = false;
    card.setPointerCapture(e.pointerId);
  });

  card.addEventListener('pointermove', function (e) {
    if (!grab || e.pointerId !== grab.id) return;
    var dx = e.clientX - grab.x0;
    var dy = e.clientY - grab.y0;
    if (!grab.moved) {
      if (Math.abs(dx) < DRAG_MIN && Math.abs(dy) < DRAG_MIN) return;
      grab.moved = true;
      // Works in flight, not only from rest: near a flat orientation the card
      // snaps and swaps axis, so a swipe across the previous one is picked up.
      if (trySwitchAxis(Math.abs(dx) >= Math.abs(dy) ? 'Y' : 'X')) {
        grab.base = angle;
      }
    }
    // Drag reads as pushing the card's surface: swipe right and the right edge
    // travels away from the viewer; swipe up and the top edge rolls away.
    var span = axis === 'Y' ? grab.rect.width : grab.rect.height;
    var moved = axis === 'Y' ? dx : -dy;
    var deg = 180 * moved / (span * SWIPE_FULL);
    angle = grab.base + deg;

    // Smoothed, so the throw comes from the gesture rather than from whatever
    // jitter the last touch sample happened to carry.
    var dt = e.timeStamp - grab.lastT;
    if (dt > 0) {
      grab.vel = grab.vel * 0.55 + ((deg - grab.lastDeg) / dt * 1000) * 0.45;
      grab.lastT = e.timeStamp;
      grab.lastDeg = deg;
    }
    setTransform(angle);
  });

  function release(e) {
    if (!grab || e.pointerId !== grab.id) return;
    var g = grab;
    grab = null;

    if (!g.moved) {
      // A tap. The press position picks the axis whenever the card is flat
      // enough to allow it; otherwise only the direction comes from the press.
      trySwitchAxis(g.zone.axis);
      target = (Math.round(angle / 180) + g.zone.dir) * 180;
    } else {
      vel = g.vel;
      var turns = angle / 180;
      // Thrown hard enough and it carries to the next face; otherwise it falls
      // to whichever side of the halfway point it was let go on.
      target = 180 * (Math.abs(vel) > FLICK
        ? (vel > 0 ? Math.floor(turns) + 1 : Math.ceil(turns) - 1)
        : Math.round(turns));
    }
    startLoop();
  }

  card.addEventListener('pointerup', release);
  card.addEventListener('pointercancel', release);

  // --- Tuning panel --------------------------------------------------------
  // Enabled with ?debug on the URL, so it costs nothing in normal use. These
  // names are top-level vars, hence window[name] reaches them: a slider writes
  // straight to the live value and the next tap uses it immediately.

  var TUNABLES = [
    ['OMEGA',         4,   30,  0.5],
    ['ZETA',       0.05,    1, 0.01],
    ['FLICK',         0,  800,   10],
    ['AXIS_SNAP',     0,   90,    1],
    ['SWIPE_FULL',  0.1,    1, 0.01],
    ['CENTRE_BAND', 0.05, 0.5, 0.01]
  ];

  // Summarise a full half-turn as its duration and the size of each overshoot,
  // so a slider's effect is readable as numbers and not only as motion.
  function previewPath() {
    var s = simulate(0, 180, 0);
    return Math.round(s.ms) + 'ms   ' + (s.peaks.length
      ? 'overshoot ' + s.peaks.map(function (p) {
          return (p > 0 ? '+' : '') + p;
        }).join('  ')
      : 'no overshoot');
  }


  function initTuning() {
    var mono = 'ui-monospace,SFMono-Regular,Menlo,monospace';
    var panel = document.createElement('div');
    panel.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9;' +
      'background:rgba(0,0,0,0.88);color:#eee;padding:8px 10px;max-height:56vh;' +
      'overflow-y:auto;touch-action:auto;-webkit-user-select:none;user-select:none;' +
      'font:12px/1.5 -apple-system,system-ui,sans-serif';

    var head = document.createElement('div');
    head.style.cssText = 'display:flex;justify-content:space-between;align-items:center';
    var title = document.createElement('b');
    title.textContent = 'Flip tuning';
    var hide = document.createElement('button');
    hide.textContent = 'hide';
    hide.style.cssText = 'background:#333;color:#eee;border:0;border-radius:4px;padding:5px 12px;font:12px -apple-system,sans-serif';
    head.appendChild(title);
    head.appendChild(hide);
    panel.appendChild(head);

    var path = document.createElement('div');
    path.style.cssText = 'font:11px/1.4 ' + mono + ';color:#7fd8c0;margin:4px 0 6px;word-break:break-word';
    panel.appendChild(path);

    var dump = document.createElement('div');
    dump.style.cssText = 'font:11px/1.4 ' + mono + ';color:#f0b46b;margin-top:8px;word-break:break-word';

    function refresh() {
      path.textContent = previewPath();
      dump.textContent = TUNABLES.map(function (t) {
        return t[0] + '=' + window[t[0]];
      }).join('   ');
    }

    TUNABLES.forEach(function (t) {
      var name = t[0];
      var row = document.createElement('label');
      row.style.cssText = 'display:grid;grid-template-columns:92px 1fr 44px;' +
        'gap:8px;align-items:center;margin:3px 0';
      var lab = document.createElement('span');
      lab.textContent = name;
      var slider = document.createElement('input');
      slider.type = 'range';
      slider.min = t[1]; slider.max = t[2]; slider.step = t[3];
      slider.value = window[name];
      slider.style.width = '100%';
      var val = document.createElement('span');
      val.style.cssText = 'text-align:right;font:11px ' + mono;
      val.textContent = window[name];
      slider.addEventListener('input', function () {
        window[name] = parseFloat(slider.value);
        val.textContent = slider.value;
        refresh();
      });
      row.appendChild(lab);
      row.appendChild(slider);
      row.appendChild(val);
      panel.appendChild(row);
    });

    panel.appendChild(dump);

    // Collapse to a small button: the panel covers the card's lower tap zones,
    // so the bottom-centre X flip cannot be tested while it is open.
    var show = document.createElement('button');
    show.textContent = 'tuning';
    show.style.cssText = 'position:fixed;right:8px;bottom:8px;z-index:9;display:none;' +
      'background:rgba(0,0,0,0.72);color:#eee;border:0;border-radius:4px;' +
      'padding:7px 13px;font:12px -apple-system,sans-serif';
    hide.addEventListener('click', function () {
      panel.style.display = 'none';
      show.style.display = 'block';
    });
    show.addEventListener('click', function () {
      panel.style.display = '';
      show.style.display = 'none';
    });

    document.body.appendChild(panel);
    document.body.appendChild(show);
    refresh();
  }

  if (params.has('debug')) initTuning();

  // Block pinch-zoom and double-tap zoom.
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('touchmove', function (e) {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js');
    });
  }
</script>
</body>
</html>
